<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMPC 2026 · Evanston</title>
<style>
  :root{
    --ink:#f5f6f8; --sub:#c9cdd6;
    --glass: rgba(18,20,26,.55);
    --glass-border: rgba(255,255,255,.14);
    --accent:#6ee7ff; --accent2:#a78bfa;
    --yellow:#f5c542;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:#050608; color:var(--ink); overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
  }

  .stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .frame{ position:relative; width:100%; height:100%; overflow:hidden; }
  .ph-layer{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#1b1032,#0a1a22 60%);
    opacity:0; transition:opacity 1s ease; overflow:hidden;
  }
  .ph-layer.active{ opacity:1; }
  .ph-layer .bgblur{
    position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover;
    filter:blur(46px) brightness(.5) saturate(1.15);
    transform:scale(1.1); transform-origin:center;
  }
  .ph-layer.active .bgblur{ animation:bgdrift 14s ease-in-out forwards; }
  .ph-layer.active.no-zoom .bgblur{ animation:none; transform:scale(1.1); }
  @keyframes bgdrift{
    from{ transform:scale(1.1) translate(0,0); }
    to{ transform:scale(1.18) translate(-1.5%,1%); }
  }
  .ph-layer .media{
    position:relative; z-index:1; width:100%; height:100%; object-fit:contain;
    transform-origin:center;
  }
  .ph-layer.active .media{ animation:kenburns 14s ease-in-out forwards; }
  .ph-layer.active.no-zoom .media{ animation:none; transform:scale(1); }
  @keyframes kenburns{
    from{ transform:scale(.94) translate(0,0); }
    to{ transform:scale(1) translate(-.6%,.4%); }
  }
  .ph-layer .cap{ font-size:.85rem; color:var(--sub); text-align:center; max-width:320px; opacity:.7; padding:0 1.5rem; }
  .ph-layer .cap .icon{ font-size:2rem; display:block; margin-bottom:.6rem; opacity:.6; }
  .ph-layer .badge{
    position:absolute; top:1.3rem; left:1.3rem; font-size:.68rem; font-weight:700;
    padding:.3rem .65rem; border-radius:999px; background:var(--glass); border:1px solid var(--glass-border);
    backdrop-filter:blur(10px); display:flex; align-items:center; gap:.4rem; z-index:2;
  }
  .ph-layer .badge i{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex:0 0 auto; }
  .ph-layer .badge.joseph i{ background:var(--accent2); }

  .vignette{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(to top, rgba(0,0,0,.65) 0%, rgba(0,0,0,0) 30%),
      linear-gradient(to bottom, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 22%);
  }

  .storybar{ position:fixed; top:.9rem; left:1.3rem; right:1.3rem; z-index:50; display:flex; gap:.25rem; }
  .storybar .seg{ flex:1; height:3px; border-radius:3px; background:rgba(255,255,255,.2); overflow:hidden; cursor:pointer; }
  .storybar .seg i{ display:block; height:100%; width:0%; background:#fff; }
  .storybar .seg.done i{ width:100%; }
  .storybar .seg.current i{ width:var(--p,0%); transition:width .1s linear; }
  .storybar .seg.attended{ background:rgba(245,197,66,.28); }
  .storybar .seg.day-start{ margin-left:.55rem; }

  .menubtn{
    position:fixed; top:1.5rem; right:1.3rem; z-index:60;
    width:42px; height:42px; border-radius:50%; background:var(--glass); border:1px solid var(--glass-border);
    backdrop-filter:blur(10px); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.1rem;
  }
  .navpanel{
    position:fixed; top:0; right:0; bottom:0; width:min(340px,84vw); z-index:70;
    background:rgba(14,16,21,.85); backdrop-filter:blur(18px); border-left:1px solid var(--glass-border);
    transform:translateX(100%); transition:transform .4s cubic-bezier(.4,0,.2,1);
    padding:5rem 1.3rem 1.5rem; overflow-y:auto;
  }
  .navpanel.open{ transform:translateX(0); }
  .navpanel h3{ font-size:.7rem; text-transform:uppercase; letter-spacing:.14em; color:var(--sub); margin:1.1rem 0 .5rem; }
  .navpanel h3:first-child{ margin-top:0; }
  .navitem{
    display:flex; align-items:center; justify-content:space-between; gap:.6rem;
    padding:.6rem .55rem; border-radius:10px; cursor:pointer; font-size:.85rem; transition:background .15s;
  }
  .navitem:hover{ background:rgba(255,255,255,.06); }
  .navitem.current{ background:rgba(110,231,255,.1); color:var(--accent); }
  .navitem .t{ color:var(--sub); font-size:.72rem; font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .navitem .lbl{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .navitem .dot{ width:6px; height:6px; border-radius:50%; background:var(--yellow); margin-right:.4rem; flex:0 0 auto; opacity:0; }
  .navitem.attended .dot{ opacity:1; }
  .navclose{
    position:fixed; top:1.5rem; right:1.3rem; z-index:80; width:42px; height:42px; border-radius:50%;
    background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(10px);
    color:#fff; display:none; align-items:center; justify-content:center; cursor:pointer; font-size:1.1rem;
  }
  .navclose.show{ display:flex; }
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:65; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }

  .infobox{ position:fixed; left:1.3rem; bottom:1.3rem; z-index:50; max-width:min(440px,78vw); }
  .infobox .day{
    font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    display:flex; align-items:center; gap:.5rem; margin-bottom:.3rem;
  }
  .infobox .day .lbl{
    background:linear-gradient(120deg,var(--accent),var(--accent2)); -webkit-background-clip:text;
    background-clip:text; color:transparent;
  }
  .typepill{
    font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    padding:.15rem .5rem; border-radius:999px; white-space:nowrap;
  }
  .typepill.attended{ background:rgba(245,197,66,.18); color:var(--yellow); border:1px solid rgba(245,197,66,.4); }
  .typepill.event{ background:rgba(255,255,255,.08); color:var(--sub); border:1px solid var(--glass-border); }
  .typepill.extra{ background:rgba(167,139,250,.18); color:var(--accent2); border:1px solid rgba(167,139,250,.4); }
  .infobox h1{ margin:0 0 .25rem; font-size:clamp(1.25rem,3.6vw,1.8rem); font-weight:700; letter-spacing:-.01em; text-shadow:0 2px 20px rgba(0,0,0,.5); }
  .infobox .meta{ font-size:.8rem; color:var(--sub); margin:0 0 .6rem; }
  .talkbox{
    display:none; align-items:center; gap:.5rem; font-size:.78rem; line-height:1.35; color:var(--ink);
    background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(10px);
    padding:.45rem .7rem; border-radius:10px; margin:0 0 .6rem; max-width:100%;
  }
  .talkbox.show{ display:inline-flex; }
  .talkbox .ic{ opacity:.75; flex:0 0 auto; }
  .talkbox.unknown{ font-style:italic; color:var(--sub); }
  .infobox .progbtn{
    font-size:.76rem; font-weight:600; color:#fff; background:var(--glass); border:1px solid var(--glass-border);
    backdrop-filter:blur(10px); padding:.5rem .8rem; border-radius:10px; cursor:pointer;
    display:inline-flex; align-items:center; gap:.4rem;
  }
  .progbtn svg{ width:12px; height:12px; transition:transform .25s; }
  .progbtn.open svg{ transform:rotate(180deg); }
  .progpanel{
    max-height:0; overflow:hidden; transition:max-height .35s ease; font-size:.8rem; color:var(--sub);
    line-height:1.6; margin-top:.55rem; background:var(--glass); border:1px solid var(--glass-border);
    backdrop-filter:blur(14px); border-radius:12px;
  }
  .progpanel.open{ max-height:260px; padding:.75rem .9rem; overflow-y:auto; }
  .progpanel b{ color:#fff; font-weight:600; }
  .progpanel .note{ display:block; font-style:italic; margin-bottom:.5rem; }

  .carouselnav{
    position:fixed; bottom:1.3rem; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; align-items:center; gap:.9rem;
  }
  .carouselnav .arrow{
    width:38px; height:38px; border-radius:50%; background:var(--glass); border:1px solid var(--glass-border);
    backdrop-filter:blur(10px); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .thumbdots{ display:flex; gap:.4rem; flex-wrap:wrap; max-width:40vw; justify-content:center; }
  .thumbdots i{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.35); transition:all .3s; cursor:pointer; }
  .thumbdots i.active{ width:16px; border-radius:3px; background:#fff; }

  .swipezone{ position:fixed; top:0; bottom:0; width:18%; z-index:20; cursor:pointer; }
  .swipezone.left{ left:0; } .swipezone.right{ right:0; }

  @media (max-width:640px){ .infobox{ max-width:90vw; } .thumbdots{ max-width:55vw; } }
</style>

const TYPE_LABEL = { attended:'assistida', event:'evento', extra:'extra' };

let curSession = 0, curPhoto = 0;
const frame = document.getElementById('frame');
const storybar = document.getElementById('storybar');
const thumbDots = document.getElementById('thumbDots');
const navPanel = document.getElementById('navPanel');

function totalSlides(s){ return Math.max(s.photos.length, 1); }

// storybar segments
sessions.forEach((s,i)=>{
  const seg = document.createElement('div');
  const dayChanged = i>0 && s.day !== sessions[i-1].day;
  seg.className = 'seg' + (s.attended ? ' attended' : '') + (dayChanged ? ' day-start' : '');
  seg.dataset.i = i;
  seg.innerHTML = '<i></i>';
  seg.addEventListener('click', ()=> goTo(i));
  storybar.appendChild(seg);
});
const segs = [...storybar.children];

// nav panel grouped by day
(function buildNav(){
  let lastDay = null;
  sessions.forEach((s,i)=>{
    if (s.day !== lastDay){
      const h3 = document.createElement('h3');
      h3.textContent = s.day;
      navPanel.appendChild(h3);
      lastDay = s.day;
    }
    const item = document.createElement('div');
    item.className = 'navitem' + (s.attended ? ' attended' : '');
    item.dataset.goto = i;
    const time = (s.meta.match(/^\d{2}:\d{2}/) || [''])[0];
    item.innerHTML = `<span class="lbl"><span class="dot"></span>${s.title}</span><span class="t">${time}</span>`;
    item.addEventListener('click', ()=> goTo(i));
    navPanel.appendChild(item);
  });
})();
const navItems = [...navPanel.querySelectorAll('.navitem')];

function render(){
  const s = sessions[curSession];
  const total = totalSlides(s);
  const p = s.photos[curPhoto];

  document.getElementById('ibDay').textContent = s.day;
  const pill = document.getElementById('ibPill');
  pill.textContent = TYPE_LABEL[s.type] || '';
  pill.className = 'typepill ' + s.type;
  document.getElementById('ibTitle').textContent = s.title;
  document.getElementById('ibMeta').textContent = s.meta;
  document.getElementById('progPanel').innerHTML = s.info || '';

  const talkEl = document.getElementById('ibTalk');
  if (p && p.talk){
    const isUnknown = !p.talk.includes('—');
    talkEl.classList.toggle('show', true);
    talkEl.classList.toggle('unknown', isUnknown);
    talkEl.innerHTML = `<span class="ic">${isUnknown ? '❔' : '🎤'}</span>${p.talk}`;
  } else {
    talkEl.classList.remove('show');
  }

  frame.innerHTML = '';
  const layer = document.createElement('div');
  layer.className = 'ph-layer active' + (p ? '' : ' empty') + (p && p.nozoom ? ' no-zoom' : '');

  if (p){
    const altText = `${s.title} — foto de ${p.who}, ${s.day} às ${p.t}`;
    const bgTag = p.video
      ? `<video class="bgblur" src="${IMG(p.f)}" autoplay muted loop playsinline aria-hidden="true"></video>`
      : `<img class="bgblur" src="${IMG(p.f)}" alt="" aria-hidden="true">`;
    const media = p.video
      ? `<video class="media" src="${IMG(p.f)}" autoplay muted loop playsinline controls></video>`
      : `<img class="media" src="${IMG(p.f)}" alt="${altText}">`;
    layer.innerHTML = `
      ${bgTag}
      ${media}
      <span class="badge ${p.who==='Joseph'?'joseph':''}"><i></i>${p.who} · ${p.t}${p.video?' · vídeo':''}</span>
    `;
  } else {
    layer.innerHTML = `<div class="cap"><span class="icon">🖼️</span>Sem fotos registradas para esta sessão.</div>`;
  }
  frame.appendChild(layer);

  thumbDots.innerHTML = '';
  for (let i=0; i<total; i++){
    const d = document.createElement('i');
    if (i===curPhoto) d.classList.add('active');
    d.addEventListener('click', ()=>{ curPhoto=i; render(); });
    thumbDots.appendChild(d);
  }

  segs.forEach((seg,i)=>{
    seg.classList.toggle('done', i<curSession);
    seg.classList.toggle('current', i===curSession);
    seg.style.setProperty('--p', i===curSession ? ((curPhoto+1)/total*100)+'%' : (i<curSession?'100%':'0%'));
  });

  navItems.forEach(el=>{
    el.classList.toggle('current', +el.dataset.goto===curSession);
  });
}

function nextPhoto(){
  const s = sessions[curSession];
  const total = totalSlides(s);
  if (curPhoto < total-1){ curPhoto++; }
  else { nextSession(); return; }
  render();
}
function prevPhoto(){
  if (curPhoto>0){ curPhoto--; render(); }
  else if (curSession>0){ curSession--; curPhoto = totalSlides(sessions[curSession])-1; render(); }
}
function nextSession(){
  if (curSession < sessions.length-1){ curSession++; curPhoto=0; render(); }
}
function goTo(i){ curSession=i; curPhoto=0; render(); closeNav(); }

document.getElementById('nextPhoto').addEventListener('click', nextPhoto);
document.getElementById('prevPhoto').addEventListener('click', prevPhoto);
document.getElementById('swRight').addEventListener('click', nextPhoto);
document.getElementById('swLeft').addEventListener('click', prevPhoto);

document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight') nextPhoto();
  if (e.key==='ArrowLeft') prevPhoto();
  if (e.key==='Escape') closeNav();
});

const progBtn = document.getElementById('progBtn');
progBtn.addEventListener('click', ()=>{
  progBtn.classList.toggle('open');
  document.getElementById('progPanel').classList.toggle('open');
});

const menuBtn = document.getElementById('menuBtn');
const navClose = document.getElementById('navClose');
const scrim = document.getElementById('scrim');
function openNav(){ navPanel.classList.add('open'); scrim.classList.add('show'); menuBtn.style.display='none'; navClose.classList.add('show'); }
function closeNav(){ navPanel.classList.remove('open'); scrim.classList.remove('show'); menuBtn.style.display='flex'; navClose.classList.remove('show'); }
menuBtn.addEventListener('click', openNav);
navClose.addEventListener('click', closeNav);
scrim.addEventListener('click', closeNav);

render();
</script>
